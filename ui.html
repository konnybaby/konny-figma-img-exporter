<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #fbf6ed;
    color: #1a1a1a;
    font-size: 13px;
    line-height: 1.5;
    height: 680px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid #c2c2c2;
    flex-shrink: 0;
    background: #fbf6ed;
  }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 100%; border: 1px solid #c2c2c2; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: #1a1a1a; }
  .subtitle { font-size: 11px; color: #888; margin-top: 1px; }

  /* Body */
  .body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: #888; margin-bottom: 7px;
  }

  /* Input */
  .input-row { display: flex; gap: 8px; align-items: stretch; }
  input[type="text"] {
    flex: 1;
    background: #fff;
    border: 1px solid #c2c2c2;
    border-radius: 8px;
    color: #1a1a1a;
    font-size: 12px;
    font-family: inherit;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #000; }
  input[type="text"]::placeholder { color: #aaa; }

  /* Buttons */
  .btn-sm {
    background: #000;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
    padding: 0 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-sm:hover { opacity: 0.8; }

  /* Status */
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 8px;
    font-size: 11px; border: 1px solid #c2c2c2;
    background: #fff; min-height: 36px; color: #888;
  }
  .status.ok    { border-color: #34a853; background: #f0faf3; color: #1e7e34; }
  .status.error { border-color: #ea4335; background: #fef2f1; color: #c5221f; }
  .status.warn  { border-color: #fbbc04; background: #fffbf0; color: #a37000; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: currentColor; }
  .status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Chips — 레퍼런스 .col-chip 과 같은 치수, 여기서는 토글 가능한 버튼으로 쓴다 */
  .cols-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .col-chip {
    font-size: 10px; font-weight: 600; font-family: inherit;
    padding: 3px 10px; border-radius: 20px;
    background: #fff; border: 1px solid #c2c2c2;
    color: #888; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .col-chip:hover:not(:disabled):not(.on) { border-color: #fadac3; color: #1a1a1a; }
  .col-chip.on { background: #fff0e5; border-color: #fadac3; color: #FF5A14; }
  .col-chip:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Preview */
  .preview-wrap {
    background: #fff; border: 1px solid #c2c2c2;
    border-radius: 10px; overflow: hidden;
  }
  .preview-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid #c2c2c2;
  }
  .preview-title { font-size: 11px; font-weight: 600; color: #1a1a1a; }
  .count-badge {
    font-size: 10px; font-weight: 700;
    background: #000; color: #fff;
    padding: 2px 8px; border-radius: 20px;
  }
  .preview-list { max-height: 130px; overflow-y: auto; }
  .preview-row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 6px 12px; border-bottom: 1px solid #f0ebe2;
    font-size: 11px; color: #444; cursor: pointer;
  }
  .preview-row:last-child { border-bottom: none; }
  .preview-row:hover { background: #fbf6ed; }
  .preview-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-row .dim { flex-shrink: 0; color: #aaa; }
  .preview-empty { padding: 16px; text-align: center; color: #aaa; font-size: 11px; }

  /* Footer */
  .footer {
    padding: 14px 20px; border-top: 1px solid #c2c2c2;
    display: flex; gap: 8px; flex-shrink: 0;
    background: #fbf6ed;
  }
  .btn {
    flex: 1; padding: 11px;
    border-radius: 8px; font-size: 13px;
    font-weight: 700; font-family: inherit;
    cursor: pointer; border: none;
    transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-export { background: #000; color: #fff; }
  .btn-export:hover:not(:disabled) { opacity: 0.8; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 11px; height: 11px;
    border: 2px solid rgba(0,0,0,0.15);
    border-top-color: currentColor; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
    flex-shrink: 0;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #c2c2c2; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo"><img src="https://konny.co.kr/favicon/android-icon-192x192.png" alt="Konny"/></div>
    <div>
      <div class="title">Konny Figma Image Exporter</div>
      <div class="subtitle">Konny 이미지 레이어 추출 → PNG</div>
    </div>
  </div>
</div>

<div class="body">
  <!-- 대상 지정 방식 -->
  <div>
    <div class="section-label">대상 지정</div>
    <div class="cols-row" id="targetChips">
      <button class="col-chip on" data-value="selection">선택한 레이어</button>
      <button class="col-chip" data-value="pattern">이름 패턴으로 찾기</button>
    </div>
    <div style="font-size:10px;color:#aaa;margin-top:5px;" id="targetHint"></div>
  </div>

  <!-- 레이어 이름 패턴 -->
  <div id="patternSection">
    <div class="section-label">Layer Name Pattern</div>
    <div class="input-row">
      <input type="text" id="pattern" placeholder="^KO[A-Za-z0-9]{3}_img_"/>
      <button class="btn-sm" id="btnReset">기본값</button>
    </div>
    <div style="font-size:10px;color:#aaa;margin-top:5px;"><b style="color:#888">KO</b> + 영숫자 3자 + <b style="color:#888">_img_</b> 로 시작하는 레이어만 대상</div>
  </div>

  <!-- 상태 -->
  <div id="status" class="status"><div class="dot"></div><span class="status-text" id="statusText">내보낼 레이어를 캔버스에서 선택해 주세요</span></div>

  <!-- 배율 -->
  <div>
    <div class="section-label">배율</div>
    <div class="cols-row" id="scaleChips">
      <button class="col-chip" data-value="1">1x</button>
      <button class="col-chip on" data-value="2">2x</button>
      <button class="col-chip" data-value="3">3x</button>
      <button class="col-chip" data-value="4">4x</button>
      <button class="col-chip" data-value="1000w">1000w</button>
    </div>
  </div>

  <!-- 포맷 -->
  <div>
    <div class="section-label">포맷</div>
    <div class="cols-row" id="formatChips">
      <button class="col-chip on" data-value="PNG">PNG</button>
      <button class="col-chip" data-value="JPG">JPG</button>
      <button class="col-chip" data-value="WEBP">WebP</button>
      <button class="col-chip" data-value="SVG">SVG</button>
      <button class="col-chip" data-value="PDF">PDF</button>
    </div>
  </div>

  <!-- 저장 방식 -->
  <div>
    <div class="section-label">저장 방식</div>
    <div class="cols-row" id="deliveryChips">
      <button class="col-chip on" data-value="zip">ZIP 압축 파일</button>
      <button class="col-chip" data-value="figma">개별 파일(Figma 내보내기)</button>
    </div>
    <div style="font-size:10px;color:#aaa;margin-top:5px;" id="deliveryHint"></div>
  </div>

  <!-- 옵션 -->
  <div>
    <div class="section-label">옵션</div>
    <div class="cols-row" id="optionChips">
      <button class="col-chip on" data-value="skipHidden">숨김 레이어 제외</button>
      <button class="col-chip on" data-value="sortByName">이름 순 정렬</button>
    </div>
  </div>

  <!-- 미리보기 -->
  <div class="preview-wrap">
    <div class="preview-header">
      <span class="preview-title">내보낼 레이어</span>
      <span class="count-badge" id="countBadge">0개</span>
    </div>
    <div class="preview-list" id="previewList">
      <div class="preview-empty">대상 레이어가 여기에 표시됩니다</div>
    </div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-export" id="btnExport" disabled>이미지 내보내기</button>
</div>

<script>
  var DEFAULT_PATTERN = "^KO[A-Za-z0-9]{3}_img_";

  var state = { mode: "selection", scale: "2", format: "PNG", delivery: "zip", skipHidden: true, sortByName: true };
  var collected = [];
  var matchCount = 0;
  var busy = false;
  // 네이티브 Export 안내는 selectionchange 재스캔에 덮이면 안 되므로 고정해 둔다.
  var pinnedStatus = false;

  var patternEl   = document.getElementById("pattern");
  var btnReset    = document.getElementById("btnReset");
  var statusEl    = document.getElementById("status");
  var statusText  = document.getElementById("statusText");
  var previewList = document.getElementById("previewList");
  var countBadge  = document.getElementById("countBadge");
  var btnExport   = document.getElementById("btnExport");

  try {
    var saved = localStorage.getItem("konnyImageExporter_pattern");
    if (saved) patternEl.value = saved;
  } catch (e) {}

  // ------------------------------------------------------------ zip writer
  // 저장(store) 방식만 사용. PNG/JPG는 이미 압축돼 있어 재압축 이득이 거의 없다.
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function utf8(str) {
    if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(str);
    var s = unescape(encodeURIComponent(str));
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function makeZip(files) {
    var parts = [], central = [], offset = 0;

    for (var i = 0; i < files.length; i++) {
      var nameBytes = utf8(files[i].name);
      var data = files[i].data;
      var crc = crc32(data);

      var local = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);        // version needed
      lv.setUint16(6, 0x0800, true);    // UTF-8 파일명 플래그
      lv.setUint16(8, 0, true);         // method: store
      lv.setUint16(10, 0, true);        // mod time
      lv.setUint16(12, 0x2821, true);   // mod date (2000-01-01)
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      var cd = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);        // version made by
      cv.setUint16(6, 20, true);        // version needed
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x2821, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);

      parts.push(local, data);
      central.push(cd);
      offset += local.length + data.length;
    }

    var cdSize = 0;
    for (var c = 0; c < central.length; c++) cdSize += central[c].length;

    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob(parts.concat(central, [end]), { type: "application/zip" });
  }

  // ------------------------------------------------------------- downloads
  // 메인 스레드에서 온 바이트는 보통 Uint8Array 그대로 도착하지만,
  // 직렬화 과정에서 일반 객체로 풀리는 경우도 방어한다.
  function toBytes(v) {
    if (v instanceof Uint8Array) return v;
    if (v instanceof ArrayBuffer) return new Uint8Array(v);
    if (v && typeof v.length === "number") return new Uint8Array(Array.prototype.slice.call(v));
    if (v && typeof v === "object") {
      var keys = Object.keys(v);
      var out = new Uint8Array(keys.length);
      for (var i = 0; i < keys.length; i++) out[i] = v[i];
      return out;
    }
    return new Uint8Array(0);
  }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  // ---------------------------------------------------------- WebP 변환
  // Figma 는 WebP 내보내기를 지원하지 않는다. PNG 로 받아 캔버스에서 다시
  // 인코딩한다. 알파 채널은 그대로 유지된다.
  var WEBP_QUALITY = 0.90;

  function toWebp(bytes) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
      var img = new Image();

      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);

        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          // WebP 인코더가 없으면 브라우저가 조용히 PNG 를 돌려준다. 확인이 필요하다.
          if (!blob || blob.type !== "image/webp") {
            reject(new Error("이 환경에서는 WebP 변환을 지원하지 않습니다"));
            return;
          }
          blob.arrayBuffer().then(function (ab) { resolve(new Uint8Array(ab)); }, reject);
        }, "image/webp", WEBP_QUALITY);
      };

      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("이미지를 읽지 못했습니다"));
      };

      img.src = url;
    });
  }

  async function convertAllToWebp(files) {
    var out = [];
    for (var i = 0; i < files.length; i++) {
      setStatus("", '<span class="spinner"></span>WebP 변환 중 ' + (i + 1) + " / " + files.length + " · " + escapeHtml(files[i].name));
      out.push({ name: files[i].name, data: await toWebp(files[i].data) });
    }
    return out;
  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return String(d.getFullYear()) + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes());
  }

  async function deliver(files) {
    download(makeZip(files), "konny_export_" + stamp() + ".zip");
  }

  // ------------------------------------------------------------------ view
  var TARGET_HINT = {
    pattern: "고른 프레임 아래에서 이름이 패턴에 맞는 레이어만 찾습니다. 아무것도 안 고르면 현재 페이지 전체가 대상입니다",
    selection: "캔버스에서 고른 레이어를 이름과 상관없이 내보냅니다"
  };

  var DELIVERY_HINT = {
    zip: "ZIP 하나로 받습니다. 저장 창이 한 번만 뜹니다",
    figma: "<b style=\"color:#888\">Export 설정 적용</b> 버튼을 누른 후 오른쪽 Design 패널 맨 아래 <b style=\"color:#888\">Export N layers</b> 버튼을 눌러주세요."
  };

  function setStatus(type, msg) {
    statusEl.className = "status " + type;
    statusText.innerHTML = msg;
  }

  function settings(type) {
    return {
      type: type,
      mode: state.mode,
      pattern: patternEl.value.trim() || DEFAULT_PATTERN,
      skipHidden: state.skipHidden,
      sortByName: state.sortByName,
      scale: state.scale,
      format: state.format
    };
  }

  function post(type) {
    pinnedStatus = false;
    parent.postMessage({ pluginMessage: settings(type) }, "*");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderPreview(items) {
    matchCount = items.length;
    countBadge.textContent = items.length + "개";
    btnExport.disabled = busy || items.length === 0;

    if (!items.length) {
      previewList.innerHTML = '<div class="preview-empty">' +
        (state.mode === "selection" ? "캔버스에서 레이어를 선택해 주세요" : "일치하는 레이어가 없습니다") + '</div>';
      return;
    }
    previewList.innerHTML = items.map(function (it) {
      return '<div class="preview-row" data-id="' + escapeHtml(it.id) + '" title="클릭하면 캔버스에서 선택됩니다">' +
             '<span class="nm">' + escapeHtml(it.name) + '</span>' +
             '<span class="dim">' + it.w + '×' + it.h + '</span></div>';
    }).join("");
  }

  previewList.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".preview-row") : null;
    if (!row) return;
    parent.postMessage({ pluginMessage: { type: "select", id: row.getAttribute("data-id") } }, "*");
  });

  function setBusy(v) {
    busy = v;
    btnExport.disabled = v || matchCount === 0;
  }

  // ----------------------------------------------------------------- chips
  function chipGroup(el, onPick) {
    el.addEventListener("click", function (e) {
      var chip = e.target.closest ? e.target.closest(".col-chip") : null;
      if (!chip || chip.disabled) return;
      var all = el.querySelectorAll(".col-chip");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
      chip.classList.add("on");
      onPick(chip.getAttribute("data-value"));
    });
  }

  chipGroup(document.getElementById("scaleChips"), function (v) { state.scale = v; });
    var deliveryHint = document.getElementById("deliveryHint");
  function renderDeliveryHint() { deliveryHint.innerHTML = DELIVERY_HINT[state.delivery] || ""; }
  function chipByValue(groupId, value) {
    return document.querySelector("#" + groupId + ' .col-chip[data-value="' + value + '"]');
  }

  function pickChip(groupId, value) {
    var group = document.getElementById(groupId);
    var all = group.querySelectorAll(".col-chip");
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i].getAttribute("data-value") === value);
  }

  // WebP 는 Figma 가 지원하지 않아 플러그인이 PNG 를 받아 직접 변환한다.
  // 그래서 Figma 자체 Export 를 쓰는 '개별 파일' 방식과는 함께 쓸 수 없다.
  function syncFormatDelivery() {
    var raster = state.format === "PNG" || state.format === "JPG" || state.format === "WEBP";
    var scaleChips = document.getElementById("scaleChips").querySelectorAll(".col-chip");
    for (var i = 0; i < scaleChips.length; i++) scaleChips[i].disabled = !raster;

    // WebP 는 항상 고를 수 있다. 고르면 저장 방식이 ZIP 으로 바뀐다(아래 칩 핸들러).
    chipByValue("deliveryChips", "figma").disabled = state.format === "WEBP";

    btnExport.textContent = state.delivery === "figma" ? "Export 설정 적용" : "이미지 내보내기";
    renderDeliveryHint();
  }

  var patternSection = document.getElementById("patternSection");
  var targetHint = document.getElementById("targetHint");

  function syncTarget() {
    targetHint.innerHTML = TARGET_HINT[state.mode] || "";
    // 선택한 레이어를 그대로 쓸 때는 패턴 입력이 의미가 없어 감춘다.
    patternSection.style.display = state.mode === "pattern" ? "" : "none";
  }

  chipGroup(document.getElementById("targetChips"), function (v) {
    state.mode = v;
    syncTarget();
    post("scan");
  });
  syncTarget();

  chipGroup(document.getElementById("deliveryChips"), function (v) {
    state.delivery = v;
    if (v === "figma" && state.format === "WEBP") {
      state.format = "PNG";
      pickChip("formatChips", "PNG");
    }
    syncFormatDelivery();
  });

  chipGroup(document.getElementById("formatChips"), function (v) {
    state.format = v;
    if (v === "WEBP" && state.delivery === "figma") {
      state.delivery = "zip";
      pickChip("deliveryChips", "zip");
    }
    syncFormatDelivery();
  });

  syncFormatDelivery();

  // 옵션은 서로 독립적인 on/off 토글이라 별도로 처리한다.
  document.getElementById("optionChips").addEventListener("click", function (e) {
    var chip = e.target.closest ? e.target.closest(".col-chip") : null;
    if (!chip) return;
    chip.classList.toggle("on");
    state[chip.getAttribute("data-value")] = chip.classList.contains("on");
    post("scan");
  });

  // ---------------------------------------------------------------- events
  patternEl.addEventListener("input", function () {
    try { localStorage.setItem("konnyImageExporter_pattern", patternEl.value.trim()); } catch (e) {}
    post("scan");
  });

  btnReset.addEventListener("click", function () {
    patternEl.value = DEFAULT_PATTERN;
    try { localStorage.setItem("konnyImageExporter_pattern", DEFAULT_PATTERN); } catch (e) {}
    post("scan");
  });

  btnExport.addEventListener("click", function () {
    if (busy || matchCount === 0) return;

    if (state.delivery === "figma") {
      post("native-export");
      return;
    }

    collected = [];
    setBusy(true);
    setStatus("", '<span class="spinner"></span>내보내는 중…');
    post("export");
  });

  window.onmessage = async function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "defaults") {
      DEFAULT_PATTERN = msg.pattern;
      patternEl.placeholder = msg.pattern;
      if (!patternEl.value) patternEl.value = msg.pattern;
      return;
    }

    if (msg.type === "scan-result") {
      renderPreview(msg.items);
      if (busy || pinnedStatus) return;
      if (msg.error) {
        setStatus("error", "⚠️ " + escapeHtml(msg.error));
      } else if (!msg.items.length) {
        setStatus("warn", msg.mode === "selection"
          ? "내보낼 레이어를 캔버스에서 선택해 주세요"
          : escapeHtml(msg.target) + " — 일치하는 레이어 없음");
      } else {
        setStatus("ok", escapeHtml(msg.target) + " — " + msg.items.length + "개");
      }
      return;
    }

    if (msg.type === "native-ready") {
      if (!msg.count) {
        setStatus("warn", "설정을 넣을 레이어가 없습니다");
      } else {
        setStatus("ok", "✅ 선택을 대상 " + msg.count + "개로 바꿨습니다 — 오른쪽 패널의 <b>Export " + msg.count + " layers</b> 클릭");
        pinnedStatus = true;
      }
      if (msg.errors && msg.errors.length) {
        setStatus("error", "❌ 실패 " + msg.errors.length + "건 — " + escapeHtml(msg.errors[0]));
      }
      return;
    }

    if (msg.type === "progress") {
      setStatus("", '<span class="spinner"></span>' + (msg.index + 1) + " / " + msg.total + " · " + escapeHtml(msg.name));
      return;
    }

    if (msg.type === "file") {
      collected.push({ name: msg.name, data: toBytes(msg.bytes) });
      return;
    }

    if (msg.type === "done") {
      var count = collected.length;
      if (count) {
        setStatus("", '<span class="spinner"></span>' + count + "개 파일 저장 중…");
        try {
          if (state.format === "WEBP") collected = await convertAllToWebp(collected);
          await deliver(collected);
          setStatus("ok", "✅ " + count + "개 내보내기 완료");
          parent.postMessage({ pluginMessage: { type: "notify", message: count + "개 이미지를 내보냈습니다" } }, "*");
        } catch (e) {
          setStatus("error", "❌ 저장 실패: " + escapeHtml((e && e.message) || e));
        }
      } else {
        setStatus("warn", "내보낸 파일이 없습니다");
      }
      if (msg.errors && msg.errors.length) {
        setStatus("error", "❌ 실패 " + msg.errors.length + "건 — " + escapeHtml(msg.errors[0]));
      }
      collected = [];
      setBusy(false);
      return;
    }
  };

  post("init");
</script>
</body>
</html>
